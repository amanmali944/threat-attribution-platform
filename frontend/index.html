<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Layer Threat Attribution Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: #0284c7;
            color: #fff;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .endpoint-link {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .endpoint-link:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Developer B - Platform Stub</span>
        <h1>Cross-Layer Threat Detection & Attribution</h1>
        <p>The presentation layer console is ready for integration. Backend API contracts, entity schemas, and dockerized services are running.</p>
        <a href="http://localhost:8000/docs" target="_blank" class="endpoint-link">Explore Swagger API Docs</a>
    </div>
</body>
</html>
